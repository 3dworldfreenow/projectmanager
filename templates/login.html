{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block body %}
<div style="max-width:360px;margin:70px auto;text-align:center">
  <div class="avatar av1" style="width:72px;height:72px;border-radius:20px;margin:0 auto 16px;box-shadow:0 10px 30px -8px rgba(47,125,225,.6)"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3c-3 4.5-6 7.5-6 11a6 6 0 0 0 12 0c0-3.5-3-6.5-6-11z"/></svg></div>
  <h1 style="margin-bottom:4px">Rainflow</h1>
  <p class="muted" style="margin-top:0">Software + Hardware team workspace</p>
  <form method="post" class="card" style="text-align:left">
    <label>Username</label><input name="username" required autofocus>
    <label>Password</label><input name="password" type="password" required>
    <br><br><button style="width:100%;min-height:44px;justify-content:center">Log in</button>
  </form>
</div>
{% endblock %}
