{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block pagetitle %}Password{% endblock %}
{% block body %}
<div class="ph"><div><h1>Change password</h1></div></div>
<form method="post" class="card" style="max-width:420px">
  <label>Current password</label><input name="old" type="password" required>
  <label>New password (6+ chars)</label><input name="new" type="password" required minlength="6">
  <br><br><button>Save</button>
</form>
{% endblock %}
